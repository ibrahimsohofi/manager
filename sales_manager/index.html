<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07294D" />
  <title>Ventes — SOHOFI BRICO</title>
  <!-- Brand fonts (same family as finance_manager) + Carnet display fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Noto+Kufi+Arabic:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Noto+Naskh+Arabic:wght@400..700&display=swap"
  />
  <script>
    // Theme + direction before first paint (no flash). Same keys as App.jsx ("darkMode", "language").
    try {
      if (JSON.parse(localStorage.getItem("darkMode") || "false") === true) {
        document.documentElement.classList.add("dark");
      }
      if (localStorage.getItem("language") === "ar") {
        document.documentElement.lang = "ar";
        document.documentElement.dir = "rtl";
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
