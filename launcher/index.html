<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#07294D" />
    <title>SOHOFIBRICO — Accueil</title>
    <link rel="icon" type="image/webp" href="/sohofibrico_icon.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Martian+Mono:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;600;700;800&display=swap"
    />
    <!-- Render-blocking stylesheet: loaded before first paint (no flash of unstyled content). -->
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Language before first paint (no flash). Same key as src/main.js.
      try {
        if (localStorage.getItem("launcher.lang") === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/">
          <span class="brand-mark"><img src="/sohofibrico_icon.webp" alt="" width="40" height="40" /></span>
          <span class="brand-text">
            <span class="brand-name">SOHOFI<b>BRICO</b></span>
            <span class="brand-tagline" data-i18n="tagline"></span>
          </span>
        </a>

        <div class="topbar-side">
          <div class="clock">
            <span class="clock-time" id="clock-time">--:--</span>
            <span class="clock-date" id="clock-date"></span>
          </div>
          <button
            type="button"
            class="help-btn"
            data-help-open
            data-i18n-label="help.button"
            aria-haspopup="dialog"
            aria-controls="help"
            aria-keyshortcuts="? F1"
          >
            <span aria-hidden="true">?</span>
          </button>
          <div class="lang" role="group" aria-label="Langue / اللغة">
            <button type="button" data-lang="fr" aria-pressed="true">FR</button>
            <button type="button" data-lang="ar" lang="ar" aria-pressed="false">ع</button>
          </div>
        </div>
      </header>

      <main>
        <section class="hero">
          <div class="hero-copy">
            <p class="eyebrow" data-i18n="eyebrow"></p>
            <h1 class="title">
              <span class="title-greet" id="greet"></span>
              <span class="title-main" data-i18n-html="title"></span>
            </h1>
            <p class="lead" data-i18n="lead"></p>
          </div>

          <div class="board" aria-live="polite">
            <span class="board-count"><b id="online-count">–</b>/3</span>
            <span class="board-meta">
              <span class="board-label" data-i18n="boardLabel"></span>
              <span class="board-leds" aria-hidden="true">
                <span class="led" data-led="products"></span>
                <span class="led" data-led="sales"></span>
                <span class="led" data-led="finance"></span>
              </span>
            </span>
          </div>
        </section>

        <section class="hanger" aria-labelledby="apps-heading">
          <h2 id="apps-heading" class="sr-only" data-i18n="appsHeading"></h2>
          <div class="rail" aria-hidden="true"></div>
          <ul class="tags" id="tags"></ul>
        </section>
      </main>

      <footer class="foot">
        <p><span data-i18n="footerKeys"></span> <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></p>
        <p><span data-i18n="footerRun"></span> <code>bun run dev</code></p>
        <button type="button" class="foot-help" data-help-open aria-haspopup="dialog" aria-controls="help">
          <kbd aria-hidden="true">?</kbd><span data-i18n="footerHelp"></span>
        </button>
      </footer>
    </div>

    <!-- Help: instruction sheet sliding in from the side. Lists are built and filled by src/help.js. -->
    <dialog class="help" id="help" aria-labelledby="help-title">
      <div class="help-sheet">
        <header class="help-head">
          <div class="help-head-copy">
            <p class="help-eyebrow" data-i18n="help.eyebrow"></p>
            <h2 class="help-title" id="help-title" data-i18n="help.title"></h2>
            <p class="help-intro" data-i18n="help.intro"></p>
          </div>
          <button type="button" class="help-close" data-help-close data-i18n-label="help.close">
            <span data-icon="close" aria-hidden="true"></span>
          </button>
        </header>

        <div class="help-body">
          <section class="help-sec" aria-labelledby="help-keys-title">
            <h3 class="help-sec-title" id="help-keys-title">
              <span class="help-sec-num" aria-hidden="true">01</span><span data-i18n="help.keysTitle"></span>
            </h3>
            <dl class="help-keys" id="help-keys"></dl>
            <p class="help-note" data-i18n="help.keysNote"></p>
          </section>

          <section class="help-sec" aria-labelledby="help-apps-title">
            <h3 class="help-sec-title" id="help-apps-title">
              <span class="help-sec-num" aria-hidden="true">02</span><span data-i18n="help.appsTitle"></span>
            </h3>
            <ul class="help-apps" id="help-apps"></ul>
            <div class="help-recheck">
              <button type="button" class="help-recheck-btn" id="help-recheck">
                <span data-icon="refresh" aria-hidden="true"></span><span data-i18n="help.recheck"></span>
              </button>
              <span class="help-last" id="help-last"></span>
              <!-- Announces only the manual "check now" result (the time above changes every 8 s). -->
              <span class="sr-only" id="help-live" role="status"></span>
            </div>
          </section>

          <section class="help-sec" aria-labelledby="help-lights-title">
            <h3 class="help-sec-title" id="help-lights-title">
              <span class="help-sec-num" aria-hidden="true">03</span><span data-i18n="help.lightsTitle"></span>
            </h3>
            <ul class="help-lights">
              <li class="help-light status" data-state="online">
                <span class="status-dot"></span>
                <span><b data-i18n="status.online"></b><span data-i18n="help.lights.online"></span></span>
              </li>
              <li class="help-light status" data-state="checking">
                <span class="status-dot"></span>
                <span><b data-i18n="status.checking"></b><span data-i18n="help.lights.checking"></span></span>
              </li>
              <li class="help-light status" data-state="offline">
                <span class="status-dot"></span>
                <span><b data-i18n="status.offline"></b><span data-i18n="help.lights.offline"></span></span>
              </li>
            </ul>
            <p class="help-note" data-i18n="help.lightsNote"></p>
          </section>

          <section class="help-sec" aria-labelledby="help-start-title">
            <h3 class="help-sec-title" id="help-start-title">
              <span class="help-sec-num" aria-hidden="true">04</span><span data-i18n="help.startTitle"></span>
            </h3>
            <p class="help-label" data-i18n="help.startAll"></p>
            <div class="help-cmd help-cmd-main">
              <code>bun run dev</code>
              <button type="button" class="help-copy" data-copy="bun run dev" data-i18n-label="help.copy">
                <span data-icon="copy" aria-hidden="true"></span><span data-icon="check" aria-hidden="true"></span>
              </button>
            </div>
            <p class="help-label" data-i18n="help.startOne"></p>
            <div class="help-cmds" id="help-cmds"></div>
            <p class="help-note" data-i18n="help.startNote"></p>
          </section>

          <section class="help-sec" aria-labelledby="help-lan-title">
            <h3 class="help-sec-title" id="help-lan-title">
              <span class="help-sec-num" aria-hidden="true">05</span><span data-i18n="help.lanTitle"></span>
            </h3>
            <p class="help-label" data-i18n="help.lanText"></p>
            <div class="help-cmd help-address">
              <code id="help-address"></code>
              <button type="button" class="help-copy" id="help-address-copy" data-i18n-label="help.copy">
                <span data-icon="copy" aria-hidden="true"></span><span data-icon="check" aria-hidden="true"></span>
              </button>
            </div>
            <p class="help-note help-note-warn" id="help-lan-local" data-i18n="help.lanLocal" hidden></p>
            <p class="help-note" data-i18n="help.lanNote"></p>
          </section>
        </div>

        <footer class="help-foot">
          <span class="help-foot-brand">SOHOFI <b>BRICO</b></span>
          <span class="help-foot-keys"><kbd>Esc</kbd><span data-i18n="help.keyClose"></span></span>
        </footer>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
